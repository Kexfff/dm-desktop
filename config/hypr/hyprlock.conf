# hyprlock, the lock screen (Mod+Alt+L, after 10 idle minutes, before sleep).
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Esc or Ctrl+U clears the password.

$font = Inter
$text = rgba(f5f5f7ff)
$dim = rgba(98989dff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = out, 0.05, 0.7, 0.1, 1.0
    animation = fadeIn, 1, 3, out
    animation = fadeOut, 1, 3, out
    animation = inputFieldDots, 1, 2, out
}

# The desktop as it was, blurred and darkened.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    color = rgba(000000ff)
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 96
    color = $text
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_family = $font
    font_size = 20
    color = $dim
    position = 0, 70
    halign = center
    valign = center
}

# A black pill, like dmsh's islands.
input-field {
    monitor =
    size = 300, 52
    rounding = -1
    outline_thickness = 2
    outer_color = rgba(00000000)
    check_color = rgba(8e8e93ff)
    fail_color = rgba(ff453aff)
    inner_color = rgba(000000d9)
    font_color = $text
    font_family = $font
    placeholder_text = <span foreground="##98989d">Password</span>
    fail_text = $FAIL
    dots_size = 0.22
    dots_spacing = 0.4
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# Keyboard layout, so the password goes in the right one.
label {
    monitor =
    text = $LAYOUT
    font_family = $font
    font_size = 13
    color = $dim
    position = 0, -90
    halign = center
    valign = center
}
