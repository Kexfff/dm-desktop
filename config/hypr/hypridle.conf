# hypridle, started by niri (see niri/dm-desktop/startup.kdl).
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Screen off after 5 minutes, lock after 10, and lock before going to sleep. Any input
# turns the screen back on. Apps that ask to stay awake (video, dmsh's Keep awake) pause
# the timers.

general {
    # Mod+Alt+L, the power menu and the timer below all go through `loginctl lock-session`.
    lock_cmd = pidof hyprlock || hyprlock
    # Started directly rather than through loginctl: niri can't tell hypridle when the
    # lock is up, so suspend doesn't wait for it and every millisecond counts.
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = niri msg action power-on-monitors
}

listener {
    timeout = 300
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
