# fuzzel: the app launcher (Mod+Space) and the pickers for clipboard, wallpaper and
# power. Dark to match dmsh. man fuzzel.ini
[main]
font=Inter:size=12
terminal=kitty
prompt="> "
layer=overlay
lines=10
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=8

[colors]
background=101010f2
text=e2e2e2ff
input=e2e2e2ff
prompt=b0b0b0ff
placeholder=707070ff
match=ffffffff
selection=303030ff
selection-text=ffffffff
selection-match=ffffffff
border=2f2f2fff

[border]
radius=17
width=1

[dmenu]
exit-immediately-if-empty=yes
